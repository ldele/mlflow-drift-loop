# The drift loop, on a schedule.
#
# Every Monday this runs ONE incremental cycle (scripts/run_scheduled.py): the
# first run bootstraps a champion, each later run monitors the latest window and
# retrains/promotes if the model has decayed. The MLflow state must survive
# between runs (each Action runs on a fresh VM), so we persist it back to the repo.
#
# Persistence tradeoff: committing the sqlite db + artifacts back to git is the
# simplest zero-infra option and keeps the whole drift history versioned and
# inspectable (pull, then `mlflow ui` or the dashboard's "Scheduled" profile). It
# does grow the repo over time; for a weekly cadence that's fine for a long while.
# For production you'd point MLFLOW_TRACKING_URI at a hosted tracking server with
# an object-store artifact root instead, and drop the commit-back step.
#
# One-time setup: push this repo to GitHub, enable Actions, and make sure Actions
# has write permission (Settings > Actions > General > Workflow permissions:
# "Read and write"). Then it runs itself on the cron, or via "Run workflow".
#
# Optional, and the only alarm that works when GitHub itself does not run this:
# the dead-man's switch. Create a check on an outside cron monitor that alerts
# when pings stop (healthchecks.io and Cronitor are two; any service that
# gives you a URL to GET works). Set it to expect one ping every 7 days with a
# 1-day grace, so it alerts 8 days after the last ping, in line with the
# heartbeat's limit. Then store its ping URL as a repository secret named
# HEARTBEAT_PING_URL (Settings > Secrets and variables > Actions). Until then
# the ping step skips with a notice.

name: drift-loop

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {} # manual "Run workflow" button

permissions:
  contents: write # to commit the persisted MLflow state back
  issues: write # to say so when a cycle fails (see the last step)

concurrency:
  group: drift-loop # never let two scheduled runs overlap on the same state
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Ubuntu runners have a working OpenSSL and no TLS-intercepting proxy, so
      # the Windows-local interpreter / --system-certs workarounds aren't needed.
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up environment
        run: uv sync --python 3.12 # reproducible install driven by uv.lock

      # Says so when the store is already stale before this run starts, which is
      # an outage the runner's catch-up is about to repair. A warning, not a
      # failure: stopping here would stop the repair.
      - name: Heartbeat before the cycle (warn only)
        run: uv run python scripts/check_heartbeat.py --warn-only

      - name: Run one scheduled drift cycle
        id: cycle
        run: uv run python scripts/run_scheduled.py

      - name: Announce promotion
        if: steps.cycle.outputs.promotion == 'true'
        run: echo "::notice title=Drift loop — champion promoted::${{ steps.cycle.outputs.headline }}"

      - name: Persist MLflow state + gathered data back to the repo
        run: |
          git config user.name  "drift-loop-bot"
          git config user.email "drift-loop-bot@users.noreply.github.com"
          # Persist the run history AND the raw Open-Meteo data this cycle fetched,
          # so nothing we gather is lost between runs. The MLflow paths are
          # gitignored for local dev, so force-add them; data_cache is tracked.
          git add -f mlflow_scheduled.db mlartifacts_scheduled outputs/run_meta_scheduled.json
          git add data_cache
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(drift-loop): scheduled cycle $(date -u +%F) [skip ci]"
            git push
          fi

      # The heartbeat (src/driftloop/heartbeat.py): fails the job when the store
      # as just persisted has no cycle logged in the last 8 days. After the
      # persist, so a cycle that did run is kept even if this check then fails.
      # It catches a job that goes green without leaving a recent cycle on
      # record. It cannot catch a job that never starts: heartbeat.yml runs the
      # same check every day for that.
      - name: Heartbeat after the cycle
        run: uv run python scripts/check_heartbeat.py

      # The dead-man's switch. Every check above runs on GitHub, so none can
      # report GitHub not running them: Actions switched off, or scheduled
      # workflows disabled after 60 days without activity. This tells an outside
      # service "a cycle ran and the store is fresh"; that service alerts when
      # the message stops arriving, which needs nothing on GitHub to work.
      #
      # Only reached when the cycle, the persist and the heartbeat all passed, so
      # a ping means a recorded cycle, not just a job that started. A failed
      # ping only warns: the outside service already alerts on a missing ping,
      # and failing the loop for a monitoring outage would file noise.
      #
      # Skipped, with a notice, until the HEARTBEAT_PING_URL secret is set (see
      # the one-time setup at the top of this file).
      - name: Ping the dead-man's switch
        env:
          HEARTBEAT_PING_URL: ${{ secrets.HEARTBEAT_PING_URL }}
        run: |
          if [ -z "$HEARTBEAT_PING_URL" ]; then
            echo "::notice title=Dead-man's switch not configured::Set the HEARTBEAT_PING_URL secret to be alerted when this job stops running."
            exit 0
          fi
          curl -fsS -m 10 --retry 5 -o /dev/null "$HEARTBEAT_PING_URL" \
            || echo "::warning title=Dead-man's switch ping failed::The outside monitor did not receive this week's ping and will alert if none follows."

      # A red tick in the Actions tab is only a notice to somebody who looks at
      # the Actions tab. This job failed every Monday from 2026-08-03 to
      # 2026-09-07 and the loop was down for six weeks before anyone noticed, so
      # a failure now files itself where the work is. One issue, reopened and
      # commented on rather than duplicated, so a long outage is one thread
      # (scripts/file_failure_issue.sh, shared with heartbeat.yml).
      # Last, so it also files a failed heartbeat.
      - name: File a failure where it will be seen
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/file_failure_issue.sh "The scheduled job failed: $RUN_URL

          Either the cycle itself failed, or it finished without a recent cycle on
          record (the heartbeat step says which). Every failed Monday is a weekly
          decision nobody takes. The runner catches up the weeks it missed once it
          runs again (\`scripts/run_scheduled.py\`), so fixing this restores the
          decisions as well as the schedule."
