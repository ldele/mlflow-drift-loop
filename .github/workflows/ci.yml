# Lint and test on every push and pull request.
#
# The other two workflows deploy things; this one is the gate that decides
# whether they should. It runs the same two commands the Quickstart tells a
# reader to run locally, so a green badge means exactly what it looks like.
#
# No network: the Open-Meteo tests are mocked and everything else is synthetic
# or reads the committed parquet cache.

name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Set up environment
        run: uv sync --python 3.12 --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q
