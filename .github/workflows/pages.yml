# Publish the interactive static dashboard to GitHub Pages.
#
# GitHub Pages can't run Streamlit (no server), but it serves the client-side
# JavaScript charts that scripts/build_site.py bakes out. This rebuilds the
# data, builds site/index.html, and deploys it to Pages.
#
# The live/scheduled history comes from the committed mlflow_scheduled.db. The
# city runs rebuild from the committed data_cache parquet (no re-fetch), so the
# published charts always match the raw data we've stored. The weekly cron picks
# up each new live cycle.

name: pages

on:
  push:
    branches: [master]
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC, after the drift-loop cycle runs

permissions:
  contents: read
  pages: write
  id-token: write

# Queue Pages runs, never cancel one that is already deploying. This used to be
# `cancel-in-progress: true`, which is wrong for a deployment: a cancelled run
# can leave a deployment it had already created sitting server-side, and every
# later run then queues behind it and times out in `deployment_queued`. Several
# pushes in a row is all it takes, and that is exactly the shape of a day spent
# committing. GitHub's own Pages template sets this to false for this reason.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Split from the deploy so a five-minute rebuild does not hold the Pages
  # environment open, and so a failed deploy can be re-run on its own.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Set up environment
        run: uv sync --python 3.12

      - name: Rebuild every city run from the committed cache (live history is committed)
        run: uv run python scripts/run_openmeteo.py --fresh --city all

      - name: Score the champions against the baselines and tune alpha
        run: uv run python scripts/benchmark.py --city all

      - name: Build the static site
        run: uv run python scripts/build_site.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
